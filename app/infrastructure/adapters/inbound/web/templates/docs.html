<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swagger · Mercado hexagonal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
<style>body { margin: 0; } .back { padding: 10px 20px; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="back"><a href="{{ url_for('web.index') }}">← Volver a la interfaz</a></div>
<div id="swagger-ui"></div>
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  window.ui = SwaggerUIBundle({
    url: "{{ url_for('web.openapi') }}",
    dom_id: "#swagger-ui",
    deepLinking: true,
  });
</script>
</body>
</html>
